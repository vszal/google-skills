apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: nginx-spot-hunt-usc1
spec:
  description: "Spot-first class for stateless nginx in us-central1, ordered by approximate Spot $/vCPU. On-Demand floor at bottom."
  nodePoolAutoCreation:
    enabled: true
  activeMigration:
    optimizeRulePriority: true   # drift workloads back to cheaper Spot when capacity returns (requires PDB on Deployment)
  autoscalingPolicy:
    consolidationDelayMinutes: 2
    consolidationThreshold: 50
  nodePoolConfig:
    imageStreaming:
      enabled: true              # nginx replicas are interchangeable; fast pod start matters
    gvnic:
      enabled: true
  priorityDefaults:
    location:
      zones: ['us-central1-a', 'us-central1-b', 'us-central1-c', 'us-central1-f']
      locationPolicy: ANY
  priorities:
  # 1. e2 Spot — cheapest general-purpose family in us-central1
  - machineFamily: e2
    minCores: 4
    spot: true

  # 2. n2d Spot — AMD Gen 2, typically next-cheapest
  - machineFamily: n2d
    minCores: 4
    spot: true

  # 3. c4d Spot — AMD Gen 4, competitive Spot pricing, broadens AMD pool
  - machineFamily: c4d
    minCores: 4
    spot: true

  # 4. n4 Spot — Intel Gen 4, broadens chip-vendor diversity for obtainability
  - machineFamily: n4
    minCores: 4
    spot: true

  # 5. On-Demand floor — guarantees execution if all Spot is exhausted
  - machineFamily: e2
    minCores: 4
    spot: false

  whenUnsatisfiable: ScaleUpAnyway
